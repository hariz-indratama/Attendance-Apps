name: attendance_app
description: "Employee attendance tracking app with GPS-based clock in/out"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Networking
  dio: ^5.7.0

  # Dependency Injection
  get_it: ^8.0.3

  # Routing
  go_router: ^14.6.2

  # Local Storage
  shared_preferences: ^2.3.4

  # Local Database (Offline Support)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Background Sync
  workmanager: ^0.5.2

  # Connectivity
  connectivity_plus: ^6.1.0

  # Device Info
  device_info_plus: ^11.1.0

  # Location
  geolocator: ^13.0.2

  # Maps (OpenStreetMap - no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Image Picker
  image_picker: ^1.1.2

  # File Picker
  file_picker: ^8.1.6

  # JSON Serialization
  json_annotation: ^4.9.0

  # Utils
  intl: ^0.20.1

  # Toast
  fluttertoast: ^8.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4

flutter:
  uses-material-design: true
